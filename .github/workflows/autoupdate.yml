name: CI

on:
  # Deliberately NOT on: push. This workflow opens a PR that rewrites the files
  # you just pushed (oxipng recompresses every PNG), which then conflicts with
  # your next edit. Schedule-only is calmer.
  schedule:
    - cron: '30 2 * * *'  # Run once per day

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unciv-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: oxipng image compression # This needs to be before the Unciv run since that packs images
        run: |
          # The repo moved from shssoichiro/oxipng to oxipng/oxipng; the old API path
          # answers 301, so curl needs -L. Anchoring the grep to https://[^"]* keeps it
          # from swallowing the whole single-line JSON body.
          oxipng_url=$(curl -sL https://api.github.com/repos/oxipng/oxipng/releases/latest \
            | grep -oE 'https://[^"]*x86_64-unknown-linux-gnu\.tar\.gz' | head -1)
          test -n "$oxipng_url" || { echo "Could not find an oxipng linux release asset"; exit 1; }
          wget -q -O oxipng.tar.gz "$oxipng_url"
          tar -xzf oxipng.tar.gz
          rm oxipng.tar.gz

          # We're left with a folder named like "oxipng-10.2.1-x86_64-unknown-linux-gnu"
          # which contains the actual executable
          oxipng_file=$(find oxipng-* -type f -name oxipng | head -1)

          # Run it on all png files under any "Images" folder, then delete the extracted
          # folder so it won't be a git diff. -r so an empty mod doesn't invoke oxipng
          # with no file arguments.
          find . -type f -name '*.png' -path '*/Images*/*' \
            | xargs -r -d '\n' "$oxipng_file" --opt max --strip all --alpha
          rm -rf oxipng-*

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # Runs a set of commands using the runners shell
      - name: Autoupdate
        continue-on-error: true  # We want to autoupdate even if there are errors
        run: |
          unciv_url=$(curl -sL https://api.github.com/repos/yairm210/Unciv/releases/latest \
            | grep -oE 'https://[^"]*Unciv\.jar' | head -1)
          test -n "$unciv_url" || { echo "Could not find a Unciv.jar release asset"; exit 1; }
          wget -q -O Unciv.jar "$unciv_url"
          java -jar Unciv.jar mod-ci

      - name: Remove Unciv executable
        run: rm -f Unciv.jar  # -f: the Autoupdate step may have failed before downloading it

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Autoupdate
